<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="https://8zs8.github.io/ft/logo.png">
<link rel="shortcut icon" type="image/png" href="https://8zs8.github.io/ft/logo.png">
<title>文件传输 - FileTransfer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
input { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #2c3e50; min-height: 100vh; }
#app { max-width: 800px; margin: 0 auto; padding: 20px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; position: relative; }
.header h1 { font-size: 22px; margin-bottom: 8px; }
.header p { opacity: 0.9; font-size: 14px; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.header-top > div:first-child { flex: 1; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
.logout-btn:hover { background: rgba(255,255,255,0.3); }
.card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.card h2 { font-size: 16px; margin-bottom: 12px; color: #34495e; }
.file-list { list-style: none; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #ecf0f1; transition: background 0.2s; }
.file-item:hover { background: #f8f9fa; }
.file-item:last-child { border-bottom: none; }
.file-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.file-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.icon-folder { background: #ffeaa7; }
.icon-file { background: #dfe6e9; }
.file-name { font-size: 14px; color: #2c3e50; word-break: break-all; overflow-wrap: anywhere; }
.file-rel { font-size: 11px; color: #95a5a6; margin-top: 2px; word-break: break-all; overflow-wrap: anywhere; line-height: 1.5; }
.file-meta { font-size: 12px; color: #95a5a6; margin-top: 2px; }
.file-actions { display: flex; gap: 8px; flex-shrink: 0; }
.action-btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.action-download { background: #667eea; color: white; }
.action-download:hover { background: #5a6fd8; }
.action-navigate { background: #fdcb6e; color: #2c3e50; }
.action-navigate:hover { background: #f5b041; }
.breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.breadcrumb-item { padding: 6px 12px; background: white; border-radius: 6px; cursor: pointer; font-size: 13px; color: #667eea; border: none; }
.breadcrumb-sep { color: #bdc3c7; }
.options-bar { display: flex; gap: 16px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
.option-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #667eea; background: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; user-select: none; }
.option-label input { margin: 0; cursor: pointer; }
.drive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.drive-item { background: #f8f9fa; border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
.drive-item:hover { background: #e8f4fd; border-color: #74b9ff; }
.drive-icon { font-size: 32px; margin-bottom: 8px; }
.drive-name { font-size: 14px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; word-break: break-all; }
.drive-info { font-size: 12px; color: #95a5a6; }
.drive-bar { width: 100%; height: 4px; background: #ecf0f1; border-radius: 2px; margin-top: 8px; overflow: hidden; }
.drive-bar-fill { height: 100%; background: linear-gradient(90deg, #00b894, #00cec9); }
.upload-area { border: 2px dashed #dcdde1; border-radius: 12px; padding: 40px; text-align: center; transition: all 0.3s; cursor: pointer; }
.upload-area.dragover { border-color: #667eea; background: #f0f3ff; }
.upload-icon { font-size: 48px; margin-bottom: 12px; }
.upload-text { color: #636e72; }
.progress-bar { width: 100%; height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden; margin-top: 12px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width 0.3s; }
.progress-fill.upload { background: linear-gradient(90deg, #11998e, #38ef7d); }
.progress-fill.download { background: linear-gradient(90deg, #667eea, #764ba2); }
.progress-text { font-size: 12px; color: #636e72; margin-top: 6px; }
.loading-spinner { display: flex; justify-content: center; align-items: center; padding: 40px; }
.spinner { width: 40px; height: 40px; border: 4px solid #ecf0f1; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.upload-disabled { text-align: center; padding: 24px; color: #95a5a6; }
.task-list { margin-top: 12px; }
.task-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 13px; color: #2c3e50; word-break: break-all; }
.task-progress-bar { width: 100%; height: 6px; background: #dfe6e9; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.task-progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; transition: width 0.3s; }
.task-progress-fill.upload { background: linear-gradient(90deg, #11998e, #38ef7d); }
.task-progress-fill.download { background: linear-gradient(90deg, #0984e3, #74b9ff); }
.task-status { font-size: 11px; color: #95a5a6; margin-top: 2px; }
.task-status.done { color: #00b894; }
.task-status.error { color: #d63031; }
.task-cancel { background: #dfe6e9; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; color: #636e72; }
.task-cancel:hover { background: #b2bec3; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #2d3436; color: white; border-radius: 8px; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 40px; color: #b2bec3; }
.hidden { display: none; }
.permission-denied { color: #e74c3c; font-size: 12px; padding: 8px; background: #ffeaa7; border-radius: 6px; margin-top: 8px; }
.conn-info { background: rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; margin-top: 12px; }
.conn-info-title { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
.conn-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.conn-label { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
.conn-url { flex: 1; font-family: monospace; word-break: break-all; opacity: 0.95; cursor: pointer; }
.conn-copy { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.conn-copy:hover { background: rgba(255,255,255,0.3); }
.qr-section { display: flex; align-items: center; gap: 15px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); }
.qr-img { width: 100px; height: 100px; border-radius: 8px; background: white; padding: 4px; }
.qr-hint { font-size: 12px; opacity: 0.9; line-height: 1.5; }
.back-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #667eea; margin-right: 8px; }
.back-btn:hover { background: #f0f3ff; }
.search-bar { margin: 0 0 12px 0; position: relative; }
.search-input { width: 100%; padding: 10px 38px 10px 38px; border: 2px solid #dfe6e9; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit; background: #f8f9fa url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2395a5a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 12px center; }
.search-input:focus { border-color: #667eea; background-color: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
.search-input.searching { border-color: #00b894; background-color: white; }
.search-input::placeholder { color: #b2bec3; }
.search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: none; background: #dfe6e9; color: #636e72; border-radius: 50%; cursor: pointer; font-size: 14px; line-height: 1; display: none; align-items: center; justify-content: center; }
.search-clear.show { display: flex; }
.search-clear:hover { background: #b2bec3; color: #2d3436; }
.search-hint { font-size: 11px; color: #b2bec3; margin: -8px 0 10px 4px; }
.search-progress { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ecf0f1; }
.search-progress-info { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #636e72; margin-bottom: 6px; }
.search-progress-count { font-weight: 600; color: #2c3e50; }
.search-progress-bar { width: 100%; height: 6px; background: #ecf0f1; border-radius: 3px; overflow: hidden; position: relative; }
.search-progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; width: 0; transition: width 0.3s; }
.search-progress-fill.indeterminate { width: 40%; animation: indeterminate 1.2s ease-in-out infinite; }
@keyframes indeterminate { 0% { margin-left: -40%; } 50% { margin-left: 100%; } 100% { margin-left: 100%; } }
.search-progress-fill.done { width: 100%; background: linear-gradient(90deg, #00b894, #00cec9); }
.search-progress-current { font-size: 11px; color: #95a5a6; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-cancel { background: #ffeaa7; color: #2d3436; border: none; padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
.search-cancel:hover { background: #fdcb6e; }
.search-meta { font-size: 12px; color: #95a5a6; margin: -6px 0 12px 4px; }
.search-rel { font-size: 11px; color: #95a5a6; margin-top: 2px; word-break: break-all; overflow-wrap: anywhere; line-height: 1.5; }
/* 远程控制按钮 */
.remote-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; margin-left: 8px; }
.remote-btn:hover { background: rgba(255,255,255,0.35); }
/* 远程控制全屏弹窗 */
.rc-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 16px; }
.rc-overlay.show { display: flex; }
.rc-panel { background: white; border-radius: 16px; width: 100%; max-width: 920px; height: 92vh; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalIn 0.25s ease; overflow: hidden; }
@keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.rc-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #ecf0f1; flex-shrink: 0; }
.rc-title { font-size: 16px; font-weight: 600; color: #2c3e50; }
.rc-close { background: none; border: none; font-size: 22px; color: #b2bec3; cursor: pointer; line-height: 1; }
.rc-close:hover { color: #e74c3c; }
.rc-tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 2px solid #ecf0f1; flex-shrink: 0; }
.rc-tab { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 14px; color: #95a5a6; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.rc-tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
.rc-tab:hover:not(.active) { color: #2c3e50; }
.rc-tab-close-mobile { display: none; }
.rc-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.rc-tab-content { display: none; flex: 1; flex-direction: column; min-height: 0; }
.rc-tab-content.active { display: flex; }
/* 终端 */
.term-output { flex: 1; overflow-y: auto; background: #1e1e2e; color: #a6accd; font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 13px; padding: 12px; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.term-output .term-cmd { color: #89dceb; }
.term-output .term-err { color: #f38ba8; }
.term-output .term-info { color: #a6e3a1; }
.term-input-bar { display: flex; gap: 8px; padding: 10px 12px; background: #181825; border-top: 1px solid #313244; flex-shrink: 0; }
.term-prompt { color: #a6e3a1; font-family: monospace; font-size: 13px; padding: 8px 0; white-space: nowrap; }
.term-input { flex: 1; background: #313244; border: 1px solid #45475a; border-radius: 6px; padding: 8px 12px; color: #cdd6f4; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px; outline: none; }
.term-input:focus { border-color: #89b4fa; }
.term-send { padding: 8px 16px; background: #cba6f7; color: #1e1e2e; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.term-send:hover { background: #b4befe; }
.term-send:disabled { opacity: 0.5; cursor: not-allowed; }
/* 远程桌面 */
.desktop-toolbar { display: flex; gap: 8px; padding: 10px 12px; background: #f8f9fa; border-bottom: 1px solid #ecf0f1; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
.desktop-btn { padding: 6px 12px; background: white; border: 1px solid #dfe6e9; border-radius: 6px; cursor: pointer; font-size: 12px; color: #2c3e50; transition: all 0.2s; }
.desktop-btn:hover { background: #667eea; color: white; border-color: #667eea; }
.desktop-btn.active { background: #667eea; color: white; border-color: #667eea; }
.desktop-info { font-size: 11px; color: #95a5a6; margin-left: auto; }
.desktop-view { flex: 1; overflow: hidden; background: #2d3436; min-height: 0; position: relative; padding: 0; }
.desktop-screenshot { display: block; position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: contain; cursor: crosshair; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; touch-action: none; pointer-events: auto; }
.desktop-screenshot.dragging { cursor: grabbing; }
.desktop-loading { color: #b2bec3; font-size: 14px; }
.desktop-rotate-hint { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #2d3436; color: #b2bec3; font-size: 16px; align-items: center; justify-content: center; flex-direction: column; text-align: center; z-index: 10; }
/* 手机全屏 + 右侧竖排标签 */
@media (max-width: 768px) {
    .rc-overlay { padding: 0; background: #000; }
    .rc-panel { max-width: 100%; max-height: 100vh; width: 100vw; height: 100vh; border-radius: 0; flex-direction: row; animation: none; overflow: hidden; }
    /* 隐藏桌面端头部，改用标签栏内的关闭按钮 */
    .rc-header { display: none; }
    /* 内容区占满左侧（除右侧 56px 标签栏外） */
    .rc-body { order: 1; flex: 1; min-width: 0; min-height: 0; height: 100vh; overflow: hidden; }
    /* 标签栏移到右侧，竖排，固定 56px 宽度挤满高度 */
    .rc-tabs { order: 2; flex-direction: column; padding: 0; width: 56px; flex: 0 0 56px; height: 100vh; flex-shrink: 0; border-bottom: none; border-left: 1px solid #2d3436; background: #1e1e2e; justify-content: flex-start; align-items: stretch; }
    .rc-tab { padding: 16px 4px; font-size: 11px; text-align: center; border-bottom: 1px solid #313244; border-left: 3px solid transparent; margin-bottom: 0; margin-left: -2px; writing-mode: vertical-rl; text-orientation: upright; line-height: 1.4; color: #a6accd; background: transparent; }
    .rc-tab.active { border-bottom-color: #313244; border-left-color: #667eea; background: #667eea; color: white; }
    /* 标签栏底部显示关闭按钮 */
    .rc-tab-close-mobile { display: flex; align-items: center; justify-content: center; padding: 16px 4px; margin-top: auto; background: none; border: none; border-top: 1px solid #313244; font-size: 22px; color: #f38ba8; cursor: pointer; flex: 0 0 auto; }
    .rc-tab-close-mobile:hover { color: #e74c3c; background: rgba(231,76,60,0.15); }
    /* 隐藏工具栏，让截图区占满整个内容区 */
    .desktop-toolbar { display: none; }
    /* 截图区域占满，无内边距，黑色背景 */
    .desktop-view { flex: 1; padding: 0; background: #000; min-height: 0; height: 100vh; }
    /* 截图占满，无圆角无阴影，避免被压缩 */
    .desktop-screenshot { width: 100%; height: 100%; object-fit: contain; border-radius: 0; box-shadow: none; cursor: crosshair; }
    /* 终端区域占满 */
    .term-output { flex: 1; min-height: 0; }
    /* 竖屏时显示旋转提示 */
    .desktop-rotate-hint.show { display: flex; }
}
/* 协议弹窗 */
.agreement-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9500; display: none; align-items: center; justify-content: center; padding: 20px; }
.agreement-modal.show { display: flex; }
.agreement-card { background: white; border-radius: 16px; width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.agreement-header { padding: 20px; border-bottom: 1px solid #ecf0f1; }
.agreement-header h3 { font-size: 18px; color: #2c3e50; margin-bottom: 4px; }
.agreement-header p { font-size: 13px; color: #95a5a6; }
.agreement-body { flex: 1; overflow-y: auto; padding: 16px 20px; font-size: 13px; color: #636e72; line-height: 1.7; white-space: pre-wrap; }
.agreement-footer { padding: 16px 20px; border-top: 1px solid #ecf0f1; display: flex; flex-direction: column; gap: 12px; }
.agreement-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #2c3e50; cursor: pointer; }
.agreement-check input { width: 16px; height: 16px; cursor: pointer; }
.agreement-btns { display: flex; gap: 12px; }
.agreement-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.agreement-btn.agree { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.agreement-btn.agree:disabled { opacity: 0.5; cursor: not-allowed; }
.agreement-btn.decline { background: #ecf0f1; color: #636e72; }
.connection-lost { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(231, 76, 60, 0.95); color: white; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; padding: 20px; text-align: center; }
.connection-lost.show { display: flex; }
.connection-lost h2 { font-size: 24px; margin-bottom: 16px; }
.connection-lost p { font-size: 14px; margin-bottom: 24px; opacity: 0.9; }
.retry-btn { background: white; color: #e74c3c; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
.retry-btn:hover { background: #f0f0f0; }
.retry-count { font-size: 12px; opacity: 0.8; margin-top: 16px; }
@media (max-width: 600px) {
    #app { padding: 12px; }
    .header { padding: 16px; }
    .header h1 { font-size: 18px; }
    .file-actions { flex-direction: column; }
    .action-btn { width: 100%; }
    .qr-section { flex-direction: column; text-align: center; }
    .drive-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>

<div id="connectionLost" class="connection-lost">
    <h2>⚠️ 连接已断开</h2>
    <p>无法连接到文件传输服务器<br>服务器可能已停止或电脑已离线</p>
    <button class="retry-btn" onclick="reconnect()">🔄 重新连接</button>
    <div class="retry-count" id="retryCount"></div>
</div>

<!-- 服务协议弹窗 -->
<div class="agreement-modal" id="agreementModal">
    <div class="agreement-card">
        <div class="agreement-header">
            <h3>📄 远程控制服务协议</h3>
            <p>使用远程控制功能前，请仔细阅读并同意以下协议</p>
        </div>
        <div class="agreement-body" id="agreementBody">加载中...</div>
        <div class="agreement-footer">
            <label class="agreement-check">

<script>
const API_BASE = 'https://d94f6dc.r29.cpolar.top';

function api(path) {
    return API_BASE + path;
}

let currentPath = '/';
let serverInfo = {};
let drivesCache = [];
let connectionCheckInterval = null;
let connectionLostShown = false;
let consecutiveFailures = 0;
let hasSession = false;
const MAX_FAILURES = 2;
let showHidden = false;
let showSystem = false;
let tasks = [];
let taskIdCounter = 0;
let currentFiles = [];   // 当前目录文件列表缓存
let searchKeyword = '';  // 当前搜索关键字
let searchResults = [];  // 搜索结果累积列表
let searchAbort = null;  // 当前搜索请求的 AbortController
let searchTimer = null;  // 输入防抖计时器
let searchActive = false;       // 是否正在搜索
let searchToken = 0;            // 搜索令牌（用于丢弃被新搜索取代的旧请求的状态更新）
let searchProgress = { scanned: 0, matched: 0, current_dir: '', done: false, truncated: false };

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

function showConnectionLost() {
    if (!connectionLostShown) {
        connectionLostShown = true;
        document.getElementById('connectionLost').classList.add('show');
    }
}

function hideConnectionLost() {
    if (connectionLostShown) {
        connectionLostShown = false;
        document.getElementById('connectionLost').classList.remove('show');
        consecutiveFailures = 0;
    }
}

async function checkConnection() {
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const resp = await fetch(api('/api/info'), { signal: controller.signal, cache: 'no-store', credentials: 'include' });
        clearTimeout(timeoutId);

        if (resp.status === 401) {
            hasSession = false;
            consecutiveFailures = 0;
            document.getElementById('retryCount').textContent = '';
            if (connectionLostShown) {
                hideConnectionLost();
            }
            return;
        }

        if (resp.ok) {
            hasSession = true;
            consecutiveFailures = 0;
            document.getElementById('retryCount').textContent = '';
            if (connectionLostShown) {
                hideConnectionLost();
                showToast('✅ 连接已恢复');
                if (currentPath === '/') {
                    loadDrives();
                } else {
                    loadFileList(currentPath);
                }
            }
        } else {
            throw new Error('Server returned ' + resp.status);
        }
    } catch (e) {
        if (hasSession) {
            consecutiveFailures++;
            document.getElementById('retryCount').textContent = '已尝试 ' + consecutiveFailures + ' 次';
            if (consecutiveFailures >= MAX_FAILURES) {
                showConnectionLost();
            }
        }
    }
}

async function reconnect() {
    hideConnectionLost();
    showToast('🔄 正在重新连接...');
    await checkConnection();
}

function formatSize(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatDriveSize(bytes) {
    if (!bytes) return '';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
}

async function loadInfo() {
    try {
        const resp = await fetch(api('/api/info'), { credentials: 'include' });
        if (resp.ok) {
            serverInfo = await resp.json();
        }
    } catch(e) {
        console.error('Failed to load info:', e);
    }
}

async function loadDrives() {
    try {
        const resp = await fetch(api('/api/drives'), { credentials: 'include' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        renderDrives();

        showToast('加载驱动器列表失败');
    }
}

function renderDrives() {
    let header = '<div class="header"><div class="header-top"><div><h1>💻 文件传输</h1><p>访问电脑所有文件</p></div><div style="display:flex; align-items:center; gap:0;"><button class="remote-btn" onclick="openRemoteControl()">🖥️ 远程控制</button><button class="logout-btn" onclick="logout()">🚪 退出</button></div></div>';

    header += '</div>';

    let optionsBar = '<div class="options-bar">' +
        '<label class="option-label"><input type="checkbox" id="showHidden" ' + (showHidden ? 'checked' : '') + ' onchange="toggleHidden(this.checked)"> 显示隐藏的文件</label>' +
        '<label class="option-label"><input type="checkbox" id="showSystem" ' + (showSystem ? 'checked' : '') + ' onchange="toggleSystem(this.checked)"> 显示受保护的系统文件</label>' +
        '</div>';

    let content = '<div class="card"><h2>💾 选择驱动器</h2>';
    if (drivesCache.length === 0) {
        content += '<div class="empty">没有找到可用的驱动器</div>';
    } else {
        content += '<div class="drive-grid">';
        drivesCache.forEach(drive => {
            const usedPercent = drive.total > 0 ? ((drive.total - drive.free) / drive.total * 100) : 0;
            const icon = drive.type === '固定驱动器' ? '💽' : drive.type === '可移动驱动器' ? '💾' : drive.type === '光盘驱动器' ? '💿' : drive.type === '远程驱动器' ? '🌐' : '📀';
            const label = drive.label ? ' (' + drive.label + ')' : '';

                '<div class="drive-icon">' + icon + '</div>' +

                '<div class="drive-info">总容量: ' + formatDriveSize(drive.total) + '</div>' +
                '<div class="drive-bar"><div class="drive-bar-fill" style="width:' + usedPercent + '%"></div></div>' +
                '</div>';
        });

    }

    document.getElementById('app').innerHTML = header + optionsBar + content + '<div id="taskList"></div>';
}

}

function copyUrl(url) {
    navigator.clipboard.writeText(url).then(() => {
        showToast('✅ 已复制到剪贴板');
    }).catch(() => {
        showToast('❌ 复制失败，请手动复制');
    });
}

function updateTaskList() {
    const container = document.getElementById('taskList');
    if (!container) return;
    const activeTasks = tasks.filter(t => t.status === 'uploading' || t.status === 'downloading');
    if (activeTasks.length === 0) {
        container.innerHTML = '';
        return;
    }
    let html = '<div class="card" style="padding:12px; margin-bottom:16px;"><h2 style="font-size:14px; margin-bottom:8px; color:#34495e;">📋 进行中的任务</h2><div class="task-list">';
    for (const task of activeTasks) {
        const percent = Math.round(task.progress);
        const sizeInfo = task.totalSize > 0 ? formatSize(task.loaded) + ' / ' + formatSize(task.totalSize) : formatSize(task.loaded);
        const speedInfo = task.speed > 0 ? ' | ' + formatSize(task.speed) + '/s' : '';
        html += '<div class="task-item">' +
            '<div class="task-info">' +
                '<div class="task-name">' + escapeHtml(task.name) + '</div>' +
                '<div class="task-progress-bar"><div class="task-progress-fill ' + task.type + '" style="width:' + percent + '%"></div></div>' +
                '<div class="task-status">' + percent + '% - ' + sizeInfo + speedInfo + '</div>' +
            '</div>' +
            '<button class="task-cancel" onclick="cancelTask(' + task.id + ')">取消</button>' +
        '</div>';
    }
    html += '</div></div>';
    container.innerHTML = html;
}

function cancelTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (task && task.xhr) { task.xhr.abort(); }
    if (task && task.controller) { task.controller.abort(); }
    task.status = 'cancelled';
    updateTaskList();
}

function addTask(task) {
    task.id = ++taskIdCounter;
    task.loaded = 0;
    task.totalSize = task.size || 0;
    task.progress = 0;
    task.speed = 0;
    task.lastLoaded = 0;
    task.lastTime = Date.now();
    tasks.push(task);
    updateTaskList();
    return task;
}

function updateTask(taskId, loaded, total) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const now = Date.now();
    const elapsed = (now - task.lastTime) / 1000;
    if (elapsed >= 0.5) {
        const delta = loaded - task.lastLoaded;
        task.speed = delta / elapsed;
        task.lastLoaded = loaded;
        task.lastTime = now;
    }
    task.loaded = loaded;
    if (total > 0) { task.progress = (loaded / total) * 100; }
    updateTaskList();
}

function completeTask(taskId, success) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.status = success ? 'done' : 'error';
    updateTaskList();
    if (success) {
        showToast('✅ ' + (task.type === 'upload' ? '上传' : '下载') + '完成: ' + task.name);
    } else {
        showToast('❌ ' + (task.type === 'upload' ? '上传' : '下载') + '失败: ' + task.name);
    }
    setTimeout(() => { tasks = tasks.filter(t => t.id !== taskId); updateTaskList(); }, 3000);
}

function removeTask(taskId) {
    tasks = tasks.filter(t => t.id !== taskId);
    updateTaskList();
}

async function loadFileList(path) {
    const loadingHtml = '<div class="card"><div class="loading-spinner"><div class="spinner"></div></div><div style="text-align:center; color:#636e72; font-size:13px;">正在加载文件列表...</div></div>';

    try {
        const url = api('/api/list') + '?path=' + encodeURIComponent(path) + '&show_hidden=' + (showHidden ? '1' : '0') + '&show_system=' + (showSystem ? '1' : '0');
        const resp = await fetch(url, { credentials: 'include' });

        const data = await resp.json();
        renderFileList(data, path);
    } catch(e) {
        showToast('加载文件列表失败');

}

        breadcrumb += '<span class="breadcrumb-sep">›</span>';
        breadcrumb += '<button class="breadcrumb-item" onclick="navigateTo(\'' + builtPath + '\')">' + decodeURIComponent(part) + '</button>';
    });
    breadcrumb += '</div>';

    let optionsBar = '<div class="options-bar">' +
        '<label class="option-label"><input type="checkbox" id="showHidden" ' + (showHidden ? 'checked' : '') + ' onchange="toggleHidden(this.checked)"> 显示隐藏的文件</label>' +
        '<label class="option-label"><input type="checkbox" id="showSystem" ' + (showSystem ? 'checked' : '') + ' onchange="toggleSystem(this.checked)"> 显示受保护的系统文件</label>' +
        '</div>';

    const isRoot = path === '/';

    let uploadArea = '';
    if (isRoot) {
        uploadArea = '<div class="card"><h2>⬆️ 上传文件到此目录</h2>' +
            '<div class="upload-disabled" style="text-align:center; padding: 24px; color: #95a5a6;">' +
            '⚠️ 请先选择一个磁盘或文件夹后再上传文件</div></div>';
    } else {
        uploadArea = '<div class="card"><h2>⬆️ 上传文件到此目录</h2>' +
            '<div class="upload-area" id="uploadArea">' +
            '<div class="upload-icon">📤</div>' +
            '<div class="upload-text">点击选择文件 或 拖拽文件到此处</div>' +
            '<input type="file" id="fileInput" multiple style="display:none">' +
            '</div></div>';
    }

    let fileListHtml = '<div class="card"><div style="display:flex; align-items:center; margin-bottom: 12px;"><button class="back-btn" onclick="goUp()">⬆️ 上级目录</button><h2 style="margin:0; flex:1;">📂 ' + (currentFiles.length > 0 ? currentFiles.length + ' 个项目' : '文件夹') + '</h2></div>';

    if (data.permission_denied && data.permission_denied.length > 0) {
        fileListHtml += '<div class="permission-denied">⚠️ ' + data.permission_denied.length + ' 个项目因权限不足无法显示</div>';
    }

    // 搜索框（非根目录时显示，搜索范围包含所有子目录）
    if (!isRoot) {
        fileListHtml += '<div class="search-bar">' +
            '<input type="text" id="searchInput" class="search-input' + (searchActive ? ' searching' : '') + '" placeholder="搜索此目录及所有子目录... (支持 * ? 通配符)" value="' + escapeHtml(searchKeyword) + '" autocomplete="off">' +
            '<button class="search-clear' + (searchKeyword ? ' show' : '') + '" id="searchClear" onclick="clearSearch()" title="清除">×</button>' +
            '</div>';
        fileListHtml += '<div class="search-hint">💡 搜索范围：当前目录及其所有子目录 · 支持通配符如 *.jpg 或 *.txt</div>';
    }

    fileListHtml += '<div id="fileListContainer">' + renderListContainer() + '</div>';
    fileListHtml += '</div>';

    document.getElementById('app').innerHTML = header + uploadArea + breadcrumb + optionsBar + fileListHtml + '<div id="taskList"></div>';
    if (!isRoot) {
        setupUpload();

    setupSearch();

// 根据搜索状态渲染列表容器内容
function renderListContainer() {
    if (!searchKeyword) {
        return renderFileItems(currentFiles);
    }
    return renderSearchPanel();
}

// 渲染搜索进度面板 + 结果列表
function renderSearchPanel() {
    let html = '<div class="search-progress">';
    html += '<div class="search-progress-info">';
    html += '<span class="search-progress-count">🔍 ' + (searchActive ? '搜索中...' : (searchProgress.done ? '搜索完成' : '')) +
        ' · 已扫描 ' + searchProgress.scanned + ' 项 · 找到 ' + searchResults.length + ' 个匹配</span>';
    if (searchActive) {
        html += '<button class="search-cancel" onclick="abortSearch()">⏹ 停止</button>';
    }
    html += '</div>';
    html += '<div class="search-progress-bar"><div class="search-progress-fill ' +
        (searchProgress.done ? 'done' : 'indeterminate') + '"></div></div>';
    if (searchProgress.current_dir && searchActive) {
        html += '<div class="search-progress-current">📂 ' + escapeHtml(searchProgress.current_dir) + '</div>';
    }
    if (searchProgress.done) {
        html += '<div class="search-progress-current">' +
            (searchProgress.truncated ? '⚠️ 结果过多，仅显示前 ' + searchResults.length + ' 项，请细化关键字' : '✅ 共扫描 ' + searchProgress.scanned + ' 项') +
            '</div>';
    }
    html += '</div>';

    if (searchResults.length === 0) {
        if (searchProgress.done) {
            html += '<div class="empty">🔍 未找到匹配 "' + escapeHtml(searchKeyword) + '" 的文件</div>';
        } else {
            html += '<div class="empty">⏳ 等待结果...</div>';
        }
    } else {
        html += '<div class="search-meta">在 "' + escapeHtml(searchKeyword) + '" 中找到 ' + searchResults.length + ' 个结果</div>';
        html += '<ul class="file-list">';
        searchResults.forEach(file => {
            const isFolder = file.is_directory;
            const icon = isFolder ? '📁' : getFileIcon(file.name);
            const iconClass = isFolder ? 'icon-folder' : 'icon-file';
            const meta = isFolder ? '文件夹' : formatSize(file.size);
            let actions = '';
            if (isFolder) {
                actions = '<button class="action-btn action-navigate" onclick="navigateTo(\'' + file.path + '\')">进入</button>';
            } else {
                actions = '<button class="action-btn action-download" onclick="downloadFile(\'' + file.path + '\')">下载</button>';
            }
            html += '<li class="file-item">' +
                '<div class="file-info">' +
                    '<div class="file-icon ' + iconClass + '">' + icon + '</div>' +
                    '<div><div class="file-name">' + escapeHtml(file.name) + '</div>' +
                    '<div class="file-rel">↳ ' + escapeHtml(file.rel_path || file.path) + '</div>' +
                    '<div class="file-meta">' + meta + '</div></div>' +
                '</div>' +
                '<div class="file-actions">' + actions + '</div>' +
            '</li>';
        });
        html += '</ul>';
    }
    return html;
}

// 渲染文件列表项（正常目录列表）
function renderFileItems(files) {
    if (currentFiles.length === 0) {
        return '<div class="empty">📭 此目录为空</div>';
    }
    let html = '<ul class="file-list">';
    files.forEach(file => {
        const isFolder = file.is_directory;
        const icon = isFolder ? '📁' : getFileIcon(file.name);
        const iconClass = isFolder ? 'icon-folder' : 'icon-file';
        const meta = isFolder ? (file.item_count || 0) + ' 个项目' : formatSize(file.size);
        let actions = '';
        if (isFolder) {
            actions = '<button class="action-btn action-navigate" onclick="navigateTo(\'' + file.path + '\')">进入</button>';
        } else {
            actions = '<button class="action-btn action-download" onclick="downloadFile(\'' + file.path + '\')">下载</button>';
        }
        html += '<li class="file-item">' +
            '<div class="file-info">' +
                '<div class="file-icon ' + iconClass + '">' + icon + '</div>' +
                '<div><div class="file-name">' + escapeHtml(file.name) + '</div>' +
                '<div class="file-meta">' + meta + '</div></div>' +
            '</div>' +
            '<div class="file-actions">' + actions + '</div>' +
        '</li>';
    });
    html += '</ul>';
    return html;
}

// 局部刷新列表容器（搜索时调用，避免整页重渲染导致闪烁）
let searchRenderPending = false;
function refreshListContainer() {
    if (searchRenderPending) return;
    searchRenderPending = true;
    requestAnimationFrame(() => {

}

function setupSearch() {

        // 清空时立即恢复目录列表，并取消正在进行的搜索
        if (!val) {
            abortSearch();
            refreshListContainer();
            return;
        }
        // 防抖：停止输入 600ms 后触发搜索
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(() => startSearch(val), 600);
    });

            e.preventDefault();
            if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }

            e.preventDefault();

        }
    });
}

// 清除搜索（恢复目录列表）
function clearSearch() {

// 取消正在进行的搜索请求
function abortSearch() {
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    if (searchAbort) {
        try { searchAbort.abort(); } catch(e) {}
        searchAbort = null;
    }
    searchActive = false;
}

// 启动流式搜索
async function startSearch(query) {
    if (!query || currentPath === '/') return;
    const myToken = ++searchToken;  // 本轮搜索的令牌
    // 取消上一次搜索
    abortSearch();
    searchResults = [];
    searchProgress = { scanned: 0, matched: 0, current_dir: '', done: false, truncated: false };
    searchActive = true;
    const input = document.getElementById('searchInput');
    if (input) input.classList.add('searching');
    refreshListContainer();

    const controller = new AbortController();
    searchAbort = controller;
    const url = api('/api/search') + '?path=' + encodeURIComponent(currentPath) +
        '&q=' + encodeURIComponent(query) +
        '&show_hidden=' + (showHidden ? '1' : '0') +
        '&show_system=' + (showSystem ? '1' : '0');

    try {
        const resp = await fetch(url, { signal: controller.signal, credentials: 'include' });
        if (myToken !== searchToken) return;  // 已被新搜索取代
        if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            showToast('搜索失败：' + (data.error || resp.status));
            searchActive = false;
            searchProgress.done = true;
            refreshListContainer();
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (myToken !== searchToken) return;  // 已被新搜索取代，停止处理
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            // 按行解析 NDJSON
            let idx;
            while ((idx = buffer.indexOf('\n')) >= 0) {
                const line = buffer.slice(0, idx).trim();
                buffer = buffer.slice(idx + 1);
                if (!line) continue;
                let evt;
                try { evt = JSON.parse(line); } catch(e) { continue; }
                handleSearchEvent(evt, myToken);
            }
        }
        // 处理剩余
        if (buffer.trim() && myToken === searchToken) {
            try { handleSearchEvent(JSON.parse(buffer.trim()), myToken); } catch(e) {}
        }
    } catch (err) {
        if (myToken !== searchToken) return;  // 已被取代，静默退出
        if (err.name === 'AbortError') {
            // 用户主动取消，静默处理
        } else {
            showToast('搜索请求失败：网络错误');
        }
    } finally {
        // 仅当本搜索仍是当前搜索时才更新最终状态
        if (myToken === searchToken) {
            searchActive = false;
            searchProgress.done = true;
            searchAbort = null;
            const inp = document.getElementById('searchInput');
            if (inp) inp.classList.remove('searching');
            refreshListContainer();
        }
    }
}

// 处理单个搜索事件
function handleSearchEvent(evt, myToken) {
    if (!evt) return;
    if (myToken !== undefined && myToken !== searchToken) return;  // 旧请求的事件，丢弃
    if (evt.type === 'progress') {
        searchProgress.scanned = evt.scanned || 0;
        searchProgress.matched = evt.matched || 0;
        searchProgress.current_dir = evt.current_dir || '';
        refreshListContainer();
    } else if (evt.type === 'match') {
        if (evt.file) {
            searchResults.push(evt.file);
            searchProgress.matched = searchResults.length;
            refreshListContainer();
        }
    } else if (evt.type === 'done') {
        searchProgress.scanned = evt.scanned || 0;
        searchProgress.matched = evt.matched || 0;
        searchProgress.done = true;
        searchProgress.truncated = !!evt.truncated;
        refreshListContainer();
    } else if (evt.type === 'error') {
        showToast('搜索出错：' + (evt.error || ''));
    }
}

function downloadFile(path) {
    const filename = decodeURIComponent(path.split('/').pop());
    const task = addTask({ type: 'download', name: filename, status: 'downloading' });
    task.controller = new AbortController();

    fetch(api('/api/download') + '?path=' + encodeURIComponent(path), { signal: task.controller.signal, credentials: 'include' })
        .then(resp => {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const contentLength = parseInt(resp.headers.get('Content-Length') || '0');
            task.totalSize = contentLength;
            const reader = resp.body.getReader();
            const chunks = [];
            let loaded = 0;

            function readChunk() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        const blob = new Blob(chunks);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        completeTask(task.id, true);
                        return;
                    }
                    chunks.push(value);
                    loaded += value.length;
                    updateTask(task.id, loaded, contentLength);
                    readChunk();
                }).catch(err => {
                    if (err.name === 'AbortError') {
                        removeTask(task.id);
                    } else {
                        completeTask(task.id, false);
                    }
                });
            }
            readChunk();
        }).catch(err => {
            if (err.name === 'AbortError') {
                removeTask(task.id);
            } else {
                completeTask(task.id, false);
            }
        });
}

function setupUpload() {

    area.addEventListener('drop', e => {

    });

}

function handleFiles(files) {
    for (const file of files) {
        uploadFile(file);
    }
}

function uploadFile(file) {
    const task = addTask({ type: 'upload', name: file.name, size: file.size, status: 'uploading' });
    const formData = new FormData();
    formData.append('path', currentPath);
    formData.append('file', file);

    const xhr = new XMLHttpRequest();
    task.xhr = xhr;

    xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) { updateTask(task.id, e.loaded, e.total); }
    };

    xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
            completeTask(task.id, true);
        } else {
            completeTask(task.id, false);
        }
        if (currentPath !== '/') {
            // 搜索进行中：上传到当前目录后刷新搜索结果；否则刷新目录列表
            if (searchKeyword) { startSearch(searchKeyword); } else { loadFileList(currentPath); }
        }
    };

    xhr.onerror = () => { completeTask(task.id, false); };
    xhr.onabort = () => { removeTask(task.id); };

    xhr.open('POST', api('/api/upload'));
    xhr.withCredentials = true;
    xhr.setRequestHeader('X-CSRF-Token', getCsrfToken());
    xhr.send(formData);
}

let rcAgreed = false;           // 是否已同意协议
let rcAgreementChecked = false;  // 是否已检查过协议状态
let termHistory = [];           // 命令历史
let termHistoryIdx = -1;
let termRunning = false;        // 终端是否有命令正在执行
let desktopAutoRefresh = false;       // 桌面流是否激活
let desktopRefreshTimer = null;      // 鼠标点击后的单次延迟刷新定时器
let desktopRefreshing = false;       // 防并发标志（fetch 单帧模式用）
let desktopScreenWidth = 0;
let desktopScreenHeight = 0;
let desktopPrevUrl = null;            // 上一帧 blob URL（fetch 模式用，即时释放）
let desktopMode = 'mjpeg';            // 当前模式：'mjpeg' 流式 / 'fetch' 单帧轮询
let desktopFallbackTimer = null;     // MJPEG 加载超时检测定时器

// 检测是否为移动设备
function isMobile() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth <= 768;
}

// 进入全屏 + 锁定横屏
async function enterFullscreenLandscape() {
    const el = document.documentElement;
    try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e) {}
    // 尝试锁定横屏（需要全屏后才能调用）
    try {
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
        }
    } catch(e) {}
}

// 退出全屏 + 解锁横屏
function exitFullscreenLandscape() {
    try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e) {}
    try {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e) {}
}

// 检查横竖屏状态，竖屏时显示提示
function checkOrientation() {
    const hint = document.getElementById('desktopRotateHint');
    if (!hint) return;
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isMobile() && isPortrait && document.getElementById('rcContentDesktop').classList.contains('active')) {
        hint.classList.add('show');
    } else {
        hint.classList.remove('show');
    }
}

// 打开远程控制（先检查协议）

    }
}

// 停止桌面实时刷新：中断 MJPEG 流或 fetch 轮询，释放内存
function stopDesktopRefresh() {
    if (desktopRefreshTimer) { clearTimeout(desktopRefreshTimer); desktopRefreshTimer = null; }
    if (desktopFallbackTimer) { clearTimeout(desktopFallbackTimer); desktopFallbackTimer = null; }
    desktopAutoRefresh = false;
    desktopRefreshing = false;
    const img = document.getElementById('screenshotImg');
    if (img) {
        img.onload = null;
        img.onerror = null;     // 防止中断触发 onerror 弹协议
        img.src = '';           // 设置空 src 中断 MJPEG 流
        img.removeAttribute('src');
    }
    // 释放 fetch 模式残留的 blob URL
    if (desktopPrevUrl) {
        try { URL.revokeObjectURL(desktopPrevUrl); } catch(e) {}
        desktopPrevUrl = null;
    }
}

// 启动桌面实时刷新：优先 MJPEG 流（高帧率、浏览器原生内存管理）
// 失败回退到 fetch 单帧轮询（Safari/被代理缓冲等场景的兼容回退）
function startDesktopRefresh() {
    if (desktopAutoRefresh) return;
    desktopAutoRefresh = true;
    // 走 cpolar 隧道等反向代理时，MJPEG multipart 流会被缓冲导致严重延迟，直接用 fetch 模式
    // 直连（局域网/IP）时才尝试 MJPEG 流以获得 24 FPS 流畅体验
    const isThroughProxy = /cpolar|frp|ngrok|cloudflare|tunnel/i.test(API_BASE) || API_BASE.includes('.top');
    const info = document.getElementById('desktopInfo');
    if (isThroughProxy) {
        desktopMode = 'fetch';
        _initDesktopView();
        if (info) info.textContent = '🔄 v3.1 兼容模式启动中...';
        refreshScreenshot();
        return;
    }
    desktopMode = 'mjpeg';
    _initDesktopView();
    const img = document.getElementById('screenshotImg');
    if (!img) return;
    if (info) info.textContent = '🔄 v3.1 MJPEG 模式启动中（24 FPS）...';
    // onload 在 MJPEG 流接收第一帧时触发；若 2 秒未触发，判定为不支持/被代理缓冲，切换 fetch 模式
    img.onload = function() {
        if (desktopFallbackTimer) { clearTimeout(desktopFallbackTimer); desktopFallbackTimer = null; }
    };
    img.onerror = function() {
        if (!desktopAutoRefresh) return;
        _switchToFetchMode('❌ MJPEG 流加载失败，已切换兼容模式');
    };
    // 启动 MJPEG 流（携带 cookie 跨域）
    img.crossOrigin = 'use-credentials';
    img.src = api('/api/mjpeg') + '?t=' + Date.now();
    // 2 秒超时检测：MJPEG 应在 1 秒内推送第一帧；超时降级 fetch 模式
    desktopFallbackTimer = setTimeout(() => {
        if (!desktopAutoRefresh) return;
        if (!img.naturalWidth) {
            _switchToFetchMode('⚠️ MJPEG 不支持，已切换兼容模式');
        }
    }, 2000);
}

// 创建 img 元素并绑定鼠标/触摸事件（两种模式共用）
function _initDesktopView() {
    const view = document.getElementById('desktopView');
    view.innerHTML = '<img class="desktop-screenshot" id="screenshotImg" alt="屏幕截图" draggable="false" ondragstart="return false">';
    const img = document.getElementById('screenshotImg');
    img.addEventListener('click', (e) => { e.preventDefault(); doMouseAction(e.clientX, e.clientY, 'click'); });
    img.addEventListener('contextmenu', (e) => { e.preventDefault(); doMouseAction(e.clientX, e.clientY, 'right'); });
    img.addEventListener('dblclick', (e) => { e.preventDefault(); doMouseAction(e.clientX, e.clientY, 'dblclick'); });
    img.addEventListener('touchstart', onTouchStart, { passive: false });
    img.addEventListener('touchmove', onTouchMove, { passive: false });
    img.addEventListener('touchend', onTouchEnd, { passive: false });
    img.addEventListener('touchcancel', onTouchEnd, { passive: false });
}

// 切换到 fetch 单帧轮询模式（Safari 不支持 multipart / cpolar 缓冲 MJPEG 的兼容回退）
function _switchToFetchMode(reason) {
    desktopMode = 'fetch';
    if (desktopFallbackTimer) { clearTimeout(desktopFallbackTimer); desktopFallbackTimer = null; }
    // 重新创建 img 元素：彻底丢弃 MJPEG 连接（仅 img.src='' 浏览器可能仍保留旧请求）
    _initDesktopView();
    const info = document.getElementById('desktopInfo');
    if (info) info.textContent = reason;
    refreshScreenshot();
}

// fetch 单帧轮询刷新（MJPEG 不支持时的兼容回退）
// 严格内存管理：desktopPrevUrl 单帧引用 + 即时释放 + 防并发，无堆积
async function refreshScreenshot() {
    if (!rcAgreed) { showAgreement(); return; }
    if (desktopMode !== 'fetch') return;
    if (desktopRefreshing) return;
    desktopRefreshing = true;
    const info = document.getElementById('desktopInfo');
    const view = document.getElementById('desktopView');
    let newUrl = null;
    try {
        const resp = await fetch(api('/api/screenshot') + '?t=' + Date.now(), { credentials: 'include' });
        if (resp.status === 403) {
            const data = await resp.json().catch(() => ({}));
            if (data.need_agreement) { showAgreement(); return; }
            if (info) info.textContent = '❌ 权限不足（403）';
            return;
        }
        if (resp.status === 401) {
            if (info) info.textContent = '❌ 未登录（401），请重新登录';
            return;
        }
        if (!resp.ok) {
            if (info) info.textContent = '❌ 截屏失败 HTTP ' + resp.status;
            return;
        }
        desktopScreenWidth = parseInt(resp.headers.get('X-Screen-Width') || '0');
        desktopScreenHeight = parseInt(resp.headers.get('X-Screen-Height') || '0');
        const blob = await resp.blob();
        newUrl = URL.createObjectURL(blob);
        const img = document.getElementById('screenshotImg');
        if (img) img.src = newUrl;
        if (info) info.textContent = '🔄 兼容模式 · ' + desktopScreenWidth + 'x' + desktopScreenHeight;
        const oldUrl = desktopPrevUrl;
        desktopPrevUrl = newUrl;
        if (oldUrl) { try { URL.revokeObjectURL(oldUrl); } catch(e) {} }
        newUrl = null;
    } catch(e) {
        if (newUrl) { try { URL.revokeObjectURL(newUrl); } catch(e) {} newUrl = null; }
        if (info) info.textContent = '❌ 网络错误：' + (e.message || e.name || '未知');
    } finally {
        desktopRefreshing = false;
        if (desktopAutoRefresh && desktopMode === 'fetch') {
            // fetch 模式帧率受网络限制：手机端 350ms / PC 端 250ms
            const interval = isMobile() ? 350 : 250;
            desktopRefreshTimer = setTimeout(refreshScreenshot, interval);
        }
    }
}

// ==================== 远程命令终端 ====================
async function execTerminalCmd() {
    if (!rcAgreed) { showAgreement(); return; }
    const input = document.getElementById('termInput');
    const cmd = input.value.trim();
    if (!cmd || termRunning) return;

    // 显示命令
    const output = document.getElementById('termOutput');
    const cmdLine = document.createElement('div');
    cmdLine.className = 'term-cmd';
    cmdLine.textContent = 'PS> ' + cmd;
    output.appendChild(cmdLine);
    output.scrollTop = output.scrollHeight;

    // 记录历史
    termHistory.push(cmd);
    termHistoryIdx = termHistory.length;
    input.value = '';
    termRunning = true;
    document.getElementById('termSend').disabled = true;

    try {
        const resp = await fetch(api('/api/terminal'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCsrfToken() },
            body: JSON.stringify({ command: cmd, timeout: 30 }),
            credentials: 'include'
        });

        if (resp.status === 403) {
            const data = await resp.json().catch(() => ({}));
            if (data.need_agreement) {
                showAgreement();
                termRunning = false;
                document.getElementById('termSend').disabled = false;
                return;
            }
            output.appendChild(createTermLine('权限不足: ' + (data.error || ''), 'term-err'));
            termRunning = false;
            document.getElementById('termSend').disabled = false;
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf('\n')) >= 0) {
                const line = buffer.slice(0, idx).trim();
                buffer = buffer.slice(idx + 1);
                if (!line) continue;
                try {
                    const evt = JSON.parse(line);
                    handleTermEvent(evt, output);
                } catch(e) {}
            }
        }
        if (buffer.trim()) {
            try { handleTermEvent(JSON.parse(buffer.trim()), output); } catch(e) {}
        }
    } catch(e) {
        output.appendChild(createTermLine('网络错误: ' + e.message, 'term-err'));
    } finally {
        termRunning = false;
        document.getElementById('termSend').disabled = false;
        input.focus();
    }
}

function handleTermEvent(evt, output) {
    if (evt.type === 'output') {
        output.appendChild(createTermLine(evt.text, ''));
    } else if (evt.type === 'error') {
        output.appendChild(createTermLine('[错误] ' + evt.error, 'term-err'));
    } else if (evt.type === 'done') {
        if (evt.exit_code !== undefined && evt.exit_code !== 0) {
            output.appendChild(createTermLine('[退出码: ' + evt.exit_code + ']', 'term-err'));
        }
    }
    output.scrollTop = output.scrollHeight;
}

function createTermLine(text, cls) {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    return div;
}

// 终端输入：回车执行，上下键浏览历史
document.addEventListener('keydown', (e) => {
    if (!document.getElementById('rcOverlay').classList.contains('show')) return;
    if (e.target && e.target.id === 'termInput') {
        if (e.key === 'Enter') {
            e.preventDefault();
            execTerminalCmd();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (termHistory.length > 0 && termHistoryIdx > 0) {
                termHistoryIdx--;
                e.target.value = termHistory[termHistoryIdx];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (termHistoryIdx < termHistory.length - 1) {
                termHistoryIdx++;
                e.target.value = termHistory[termHistoryIdx];
            } else {
                termHistoryIdx = termHistory.length;
                e.target.value = '';
            }
        }
    }
});

// ==================== 远程桌面鼠标控制 ====================
// 注：MJPEG 流模式下，截图刷新由 <img src="/api/mjpeg"> 自动持续接收，
// 浏览器原生管理帧缓冲，无需 JS 轮询与 blob 释放，内存由浏览器自动回收。

// ==================== 触摸事件（手机端鼠标模拟） ====================
let touchStartX = 0, touchStartY = 0;
let touchCurrentX = 0, touchCurrentY = 0;
let touchStartTime = 0;
let touchMoved = false;
let longPressTimer = null;
let longPressFired = false;
const LONG_PRESS_MS = 500;    // 长按判定时间
const MOVE_THRESHOLD = 10;    // 移动阈值（像素），超过则判定为拖拽而非点击

function onTouchStart(e) {
    e.preventDefault();  // 阻止浏览器默认行为（拖拽图片、长按菜单）
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchCurrentX = t.clientX;
    touchCurrentY = t.clientY;
    touchStartTime = Date.now();
    touchMoved = false;
    longPressFired = false;
    // 启动长按定时器
    if (longPressTimer) clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
        longPressFired = true;
        // 长按 = 右键单击
        doMouseAction(touchCurrentX, touchCurrentY, 'right');
    }, LONG_PRESS_MS);
}

function onTouchMove(e) {
    e.preventDefault();  // 阻止页面滚动和图片拖拽
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchCurrentX = t.clientX;
    touchCurrentY = t.clientY;
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) {
        touchMoved = true;
        // 移动则取消长按
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
}

function onTouchEnd(e) {
    e.preventDefault();
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (longPressFired) return;  // 长按已触发右键，不再处理
    if (e.touches.length > 0) return;  // 还有手指在屏幕上
    const elapsed = Date.now() - touchStartTime;
    if (!touchMoved && elapsed < LONG_PRESS_MS) {
        // 短按 = 左键单击
        doMouseAction(touchCurrentX, touchCurrentY, 'click');
    }
}

// 执行鼠标操作（统一入口，PC 和手机共用）
async function doMouseAction(clientX, clientY, action) {
    if (!rcAgreed) return;
    const img = document.getElementById('screenshotImg');
    if (!img) return;
    const rect = img.getBoundingClientRect();
    // 关键：CSS 使用 object-fit: contain，图片在 <img> 盒子内保持宽高比居中缩放，
    // 会在某一方向留黑边。必须用 naturalWidth/naturalHeight 计算图片实际显示区域，
    // 否则点击坐标会整体偏移（PC 端容器比例与屏幕比例不同时尤为明显）。
    let relX, relY;
    const nw = img.naturalWidth || 0;
    const nh = img.naturalHeight || 0;
    if (nw > 0 && nh > 0 && rect.width > 0 && rect.height > 0) {
        const boxRatio = rect.width / rect.height;
        const imgRatio = nw / nh;
        let displayW, displayH, offsetX, offsetY;
        if (boxRatio > imgRatio) {
            // 盒子更宽：图片高度填满，左右留黑边
            displayH = rect.height;
            displayW = rect.height * imgRatio;
            offsetX = (rect.width - displayW) / 2;
            offsetY = 0;
        } else {
            // 盒子更高：图片宽度填满，上下留黑边
            displayW = rect.width;
            displayH = rect.width / imgRatio;
            offsetX = 0;
            offsetY = (rect.height - displayH) / 2;
        }
        relX = (clientX - rect.left - offsetX) / displayW;
        relY = (clientY - rect.top - offsetY) / displayH;
    } else {
        // 图片尚未加载，回退到简单映射
        relX = (clientX - rect.left) / rect.width;
        relY = (clientY - rect.top) / rect.height;
    }
    const x = Math.max(0, Math.min(1, relX));
    const y = Math.max(0, Math.min(1, relY));
    try {
        const resp = await fetch(api('/api/mouse'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCsrfToken() },
            body: JSON.stringify({ action: action, x: x, y: y }),
            credentials: 'include'
        });
        if (resp.status === 403) {
            const data = await resp.json().catch(() => ({}));
            if (data.need_agreement) showAgreement();
            return;
        }
        // 刷新逻辑：
        // - MJPEG 流模式：服务端下一帧（约 40ms 内）会自动推送反映鼠标变化的新截图，无需手动刷新
        // - fetch 单帧模式：取消等待中的定时器立即触发一次新帧抓取，反映鼠标变化
        if (resp.ok && desktopMode === 'fetch' && desktopAutoRefresh) {
            if (desktopRefreshTimer) { clearTimeout(desktopRefreshTimer); desktopRefreshTimer = null; }
            desktopRefreshTimer = setTimeout(refreshScreenshot, 200);
        }
    } catch(err) { /* 忽略 */ }
}

// 点击远程控制面板背景关闭
document.getElementById('rcOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('rcOverlay')) closeRemoteControl();
});
// 阻止远程桌面区域的所有浏览器右键菜单
document.getElementById('rcContentDesktop').addEventListener('contextmenu', (e) => e.preventDefault());
// 阻止拖拽
document.getElementById('rcContentDesktop').addEventListener('dragstart', (e) => e.preventDefault());

async function init() {
    // 先检测服务器是否可达（避免从 file:// 打开时跨域请求被静默阻止）
    let reachable = false;
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const resp = await fetch(api('/api/info'), {
            signal: controller.signal,
            cache: 'no-store',
            credentials: 'include'
        });
        clearTimeout(timeoutId);
        reachable = true;
        if (resp.status === 401) {
            // 未登录，跳转到登录页
            window.location.href = './login';
            return;
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        serverInfo = await resp.json();
    } catch(e) {
        // 服务器不可达：显示连接错误页面
        showConnectionError(e);
        return;
    }

    // 服务器可达，继续加载
    loadDrives();
    connectionCheckInterval = setInterval(checkConnection, 5000);
}

// 服务器不可达时显示连接错误页面（替代静默失败）
function showConnectionError(err) {
    const isLocalFile = window.location.protocol === 'file:';
    const hint = isLocalFile
        ? '检测到您正在从本地文件打开此页面。<br>由于浏览器安全策略，本地文件无法直接访问远程服务器。<br><br>请通过服务器地址访问：<br><strong>' + API_BASE + '</strong>'
        : '无法连接到服务器：<br><strong>' + API_BASE + '</strong><br><br>请检查：<br>• 服务器是否已启动<br>• 网络连接是否正常<br>• 隧道地址是否正确';

    document.getElementById('app').innerHTML =
        '<div class="card" style="text-align:center; padding:40px;">' +
        '<div style="font-size:48px; margin-bottom:16px;">🔌</div>' +
        '<h2 style="color:#e74c3c; margin-bottom:16px;">连接服务器失败</h2>' +
        '<div style="color:#636e72; font-size:14px; line-height:1.8;">' + hint + '</div>' +
        '<button class="btn btn-primary" style="margin-top:20px; max-width:200px;" onclick="location.reload()">🔄 重新尝试</button>' +
        '</div>';
}

init();
</script>
